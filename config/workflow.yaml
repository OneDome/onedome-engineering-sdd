# Environment mapping. Policy lives in `.cursor/rules/sdd-governance.mdc`.
# Spec/plan: local code + Confluence read. Git: SDD PRs via /sdd-pr; application
# branches via /start-development after approved breakdown. No Jira status updates.

schema_version: 1

# SDD delivers backend services only. Frontend/UI is out of scope.
surface: backend

spec_kit:
  status: not_initialized
  integration: cursor
  cli: null
  constitution_path: null

sources:
  jira:
    enabled: true                 # read requirements when a Jira key is given
    write: false
    status_updates: false         # later phase
    base_url: https://onedome.atlassian.net
    project_keys: []              # not required for this phase
    status_mapping: {}            # unused until status-update phase
  confluence:
    enabled: true
    write: false                  # analysis only; do not create or edit pages
    mcp:
      namespace: user-atlassian
      cloud_id: 6626650e-3259-4866-8351-e63f19447ca3
      site_host: onedome.atlassian.net
    base_url: https://onedome.atlassian.net
    wiki_base_url: https://onedome.atlassian.net/wiki
    # Current global spaces discovered via Atlassian MCP. Search across these; do not assume one "engineering" space.
    space_keys:
      - HD
      - MKT
      - TEST
      - ITi
      - ITc
      - BZS
      - BZK
      - GK
      - BD
      - BIKB
      - K
      - TKI
      - CTP
      - TPPIID
      - CS
      - OSD
      - CSKB
    tools:
      search: searchConfluenceUsingCql
      get_page: getConfluencePage
      list_spaces: getConfluenceSpaces
  source_code:
    enabled: true
    mode: local_checkout
    workspace_root: /Users/oksanaodocuk/IdeaProjects

git:
  enabled: true                   # SDD PRs via /sdd-pr; app branches after breakdown approval
  branches: true
  pull_requests: true             # SDD repo only; do not open application PRs from this flow
  hosting: github
  host_url: https://github.com
  organization: OneDome
  sdd_branch_pattern: sdd/<JIRA-KEY>
  implementation_branch_pattern: feature/<JIRA-KEY>   # example: feature/DEAL-2097
  specification_pr_target_branch: main        # also the implementation base branch

lifecycle:
  allowed_statuses:
    - specifying
    - spec_review
    - spec_approved
    - planning
    - plan_review
    - plan_approved
    - in_development
    - in_review
    - done
    - blocked
  gates:
    planning_requires:
      - specification.status == approved
      - specification.approval.status == approved
    implementation_requires:
      - specification.status == approved
      - specification.approval.status == approved
      - planning.status == approved
      - planning.approval.status == approved
      # then /start-development; write application code only after
      # development.decomposition.status == approved
  # in_development / in_review are lifecycle values. Do not add
  # implementation_complete to this list — that lives under development.status.

approval:
  specification_requires: explicit_human_approval
  specification_method: chat_then_task_state  # human says затверджую / I approve this spec; agent records in task-state.yaml
  planning_method: chat_then_task_state       # human says затверджую план / I approve this plan
  development_breakdown_method: chat_then_task_state  # I approve the development breakdown
  subtask_acceptance_method: chat_then_task_state     # I accept this subtask

automation:
  status: not_implemented
  jira: false
  confluence: false
  github: false

knowledge:
  update_after: implementation
  verify_against: source_code
