# Per-task machine-readable state.
# Copy to specs/<JIRA-KEY>/task-state.yaml.
# Canonical for automation. Humans approve specs; this file records that fact.
# Use null for unknown values. Do not invent keys, URLs, usernames, or branch names.

schema_version: 1

jira:
  key: null                       # required once work starts
  title: null

lifecycle:
  # Allowed values: config/workflow.yaml lifecycle.allowed_statuses
  status: specifying

sdd:
  branch: null                    # branch in this SDD repository; pattern sdd/<JIRA-KEY>

specification:
  status: draft                   # draft | in_review | approved | changes_requested | rejected
  path: spec.md
  pr:
    repository: null              # this SDD repo once hosting is configured
    number: null
    url: null
  approval:
    status: pending               # pending | approved
    approved_by: null             # resolved human identity; do not invent; do not store job title
    approved_at: null             # ISO-8601
    method: null                  # chat when recorded from this conversation
    notes: null

planning:
  status: not_started             # not_started | draft | in_review | approved | changes_requested | rejected
  path: plan.md
  pr:
    repository: null
    number: null
    url: null
  approval:
    status: pending               # pending | approved
    approved_by: null             # resolved human identity; do not invent; do not store job title
    approved_at: null
    method: null
    notes: null

repositories: []
  # - id: null                    # must match config/repositories.yaml[].id when registry is populated
  #   path: null
  #   branch: null                # implementation branch; pattern feature/<JIRA-KEY> in workflow.yaml
  #   impact: null                # none | read | change
  #   implementation_pr:
  #     number: null
  #     url: null

development:
  status: not_started             # not_started | awaiting_breakdown_approval | in_progress | implementation_complete
  developer: null                 # identity from the real process; do not invent
  started_at: null                # ISO-8601
  decomposition:
    status: pending               # pending | approved
    approved_by: null
    approved_at: null             # ISO-8601
    method: null                  # chat when recorded from this conversation
  current_subtask: null           # DEV-01 … or null
  subtasks: []
    # - id: DEV-01
    #   title: null
    #   repositories: []          # ids from config/repositories.yaml
    #   acceptance_criteria: []
    #   depends_on: []
    #   tests: null
    #   status: pending           # pending | in_progress | completed
  knowledge_candidates: []
    # - type: null                # architecture | domain | integration | service | other
    #   note: null
    #   discovered_during: null   # DEV-01
  implementation_prs: []
    # - repository_id: null
    #   number: null
    #   url: null
    #   status: null              # unused until application-PR phase

knowledge_updates: []
  # - path: null                  # path under knowledge/
  #   action: null                # add | update | verify
  #   notes: null
